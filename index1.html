<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketmaster Mobile App Clone - Full Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .tm-barcode { display:flex; align-items:stretch; justify-content:center; height:56px; gap:1px; overflow:hidden; }
        .tm-barcode span { display:block; background:#111; }
        .tm-barcode span.blue { background:#2563eb; }
        @keyframes barcode-shift { 0% { transform: translateX(0); } 100% { transform: translateX(-6px); } }
        .tm-barcode { animation: barcode-shift 0.7s steps(3) infinite; }
        @media print {
            body { background: white !important; color: black !important; }
            #phone-frame { max-width: 100% !important; border: none !important; box-shadow: none !important; height: auto !important; max-height: none !important; }
            #bottom-nav, #safari-footer, button { display: none !important; }
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-900 flex justify-center items-center min-h-screen font-sans antialiased select-none">
    <!-- Mobile Phone Frame Container -->
    <div id="phone-frame" class="w-full max-w-[410px] bg-black h-[100dvh] max-h-[100dvh] md:h-[min(820px,100dvh)] md:max-h-[820px] flex flex-col shadow-2xl relative overflow-hidden rounded-none border-0 pt-0 pb-0 md:rounded-[36px] md:border-[8px] md:border-neutral-900 md:pt-2 md:pb-1">
        <!-- App Dynamic Content Area -->
        <div id="app-view" class="flex-1 overflow-y-auto relative bg-white pb-28 min-h-0">
            <!-- Dynamic Views Injected Here -->
        </div>
        <div id="app-modal" class="hidden absolute inset-0 z-[90] bg-black/50 flex items-center justify-center px-5"></div>
        <!-- Global Bottom Navigation Bar (Shown ONLY in Look 1) -->
        <div id="bottom-nav" class="bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center text-[10px] text-gray-500 z-50 absolute bottom-0 left-0 right-0">
            <button onclick="switchView('discover')" class="flex flex-col items-center focus:outline-none transition text-gray-500 hover:text-black" id="nav-discover">
                <i class="fa-solid fa-magnifying-glass text-sm mb-0.5"></i>
                <span>Discover</span>
            </button>
            <button onclick="switchView('events')" class="flex flex-col items-center focus:outline-none transition hover:text-black">
                <i class="fa-regular fa-heart text-sm mb-0.5"></i>
                <span class="font-medium">Favorites</span>
            </button>
            <button onclick="switchView('events')" class="flex flex-col items-center focus:outline-none text-gray-500" id="nav-tickets">
                <i class="fa-solid fa-ticket text-sm mb-0.5"></i>
                <span>My Tickets</span>
            </button>
            <button onclick="switchView('events')" class="flex flex-col items-center focus:outline-none transition hover:text-black">
                <i class="fa-solid fa-tag text-sm mb-0.5"></i>
                <span class="font-medium">Sell</span>
            </button>
            <button onclick="switchView('account')" class="flex flex-col items-center focus:outline-none relative transition text-gray-500 hover:text-black cursor-pointer" id="nav-account">
                <i class="fa-regular fa-user text-sm mb-0.5"></i>
                <span>My Account</span>
                <span id="account-dot" class="absolute -top-0.5 right-2 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
            </button>
        </div>
        <!-- Mobile Safari Browser Footer Bar (Shown ONLY in Look 2) -->
        <div id="safari-footer" class="hidden bg-neutral-900 border-t border-neutral-800 py-2 px-4 flex justify-between items-center text-white z-50 absolute bottom-0 left-0 right-0 text-xs">
            <div class="flex space-x-4 text-neutral-400">
                <i class="fa-solid fa-arrow-left"></i>
                <i class="fa-solid fa-arrow-right opacity-40"></i>
            </div>
            <div class="bg-neutral-800 px-4 py-1 rounded-full text-[11px] text-neutral-200 font-mono tracking-tight flex items-center space-x-2">
                <span>aa</span>
                <span id="safari-domain-text" class="text-white font-sans font-medium">ticketmaster.com</span>
            </div>
            <div class="flex space-x-4 text-neutral-400">
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
                <i class="fa-solid fa-clone text-[10px]"></i>
            </div>
        </div>
        <!-- OTP Toast Notification Bar -->
        <div id="otp-toast" class="hidden absolute inset-x-4 top-14 z-[60] flex justify-center pointer-events-none">
            <div class="bg-neutral-900 text-white text-[11px] font-medium rounded-xl px-4 py-2.5 shadow-2xl text-center max-w-[320px] leading-snug">
                OTP to receive tickets has been sent to your email
            </div>
        </div>
    </div>
    <!-- JavaScript Application Logic & Persistent Storage -->
    <script>
        let defaultEvents = [
            {
                id: 1,
                showTitle: "The Weeknd: After Hours Til Dawn Tour",
                ticketType: "CAT 2 Standard",
                look2Badge: "Restricted View",
                imageLink: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80",
                date: "03 Oct 2026 (Sat.) 08:00 pm",
                purchaseDate: "15 Sep 2026",
                time: "08:00 PM",
                dayOfWeek: "Saturday",
                country: "United States",
                domain: "ticketmaster.com",
                flagLink: "🇺🇸",
                location: "Los Angeles, CA",
                venue: "National Stadium",
                sec: "434",
                row: "Row A",
                startSeat: 36,
                numTickets: 1,
                minTransferLimit: 1,
                username: "Chester leong",
                orderNumber: "TR-18492255",
                email: "chesterleong875@gmail.com",
                phoneLast4: "3321",
                mapQuery: "National+Stadium",
                ticketPrice: 246.00,
                bookingFee: 10.00,
                gate: "Gate 3 / Door A",
                attendee: "Chester leong",
                importantInfo: "Each Mobile Ticket can only be used once. Please keep your tickets safe. Doors open 90 minutes before showtime.",
                isTrending: true
            }
        ];
        let events = JSON.parse(localStorage.getItem('tm_clone_events')) || defaultEvents;
        function saveEventsToStorage() {
            localStorage.setItem('tm_clone_events', JSON.stringify(events));
        }
        let appSettings = JSON.parse(localStorage.getItem('tm_clone_settings')) || {
            allowScreenshots: true,
            blurReference: false,
            useLookTwo: false,
            allowTransfer: true,
            hiddenEvents: {}
        };
        function saveSettingsToStorage() {
            localStorage.setItem('tm_clone_settings', JSON.stringify(appSettings));
        }
        let userNotifications = JSON.parse(localStorage.getItem('tm_clone_notifs')) || [
            {
                id: 1,
                title: "Welcome to Ticketmaster",
                message: "Your account is active and verified for secure mobile ticket management.",
                time: "2h ago",
                unread: true
            }
        ];
        function saveNotifsToStorage() {
            localStorage.setItem('tm_clone_notifs', JSON.stringify(userNotifications));
        }
        let currentView = 'discover'; 
        let activeEventId = events[0]?.id || 1;
        let editingEventId = null;
        let selectedSeatsState = {};
        let recipientDraft = { fname: '', lname: '', email: '', mobile: '', note: '' };
        let activeTicketIndex = 0;
        let otpToastTimer = null;
        let lastFailedRecipient = { name: '', email: '', count: 0, minRequired: 1 };
        let showLookTwoMenuDropdown = false;
        function addNotification(title, message, timeText = "Just now") {
            userNotifications.unshift({
                id: Date.now(),
                title: title,
                message: message,
                time: timeText,
                unread: true
            });
            saveNotifsToStorage();
            updateAccountDot();
        }
        function updateAccountDot() {
            const dot = document.getElementById('account-dot');
            if (!dot) return;
            const hasUnread = userNotifications.some(n => n.unread);
            if (hasUnread) dot.classList.remove('hidden');
            else dot.classList.add('hidden');
        }
        function updateBottomNavActiveState(view) {
            const navDiscover = document.getElementById('nav-discover');
            const navAccount = document.getElementById('nav-account');
            if (navDiscover && navAccount) {
                if (view === 'discover') {
                    navDiscover.className = "flex flex-col items-center focus:outline-none transition text-blue-600 font-bold";
                    navAccount.className = "flex flex-col items-center focus:outline-none relative transition text-gray-500 hover:text-black cursor-pointer";
                } else if (view === 'account') {
                    navDiscover.className = "flex flex-col items-center focus:outline-none transition text-gray-500 hover:text-black";
                    navAccount.className = "flex flex-col items-center focus:outline-none relative transition text-black font-bold cursor-pointer";
                } else {
                    navDiscover.className = "flex flex-col items-center focus:outline-none transition text-gray-500 hover:text-black";
                    navAccount.className = "flex flex-col items-center focus:outline-none relative transition text-gray-500 hover:text-black cursor-pointer";
                }
            }
        }
        function switchView(view, eventId = null) {
            const container = document.getElementById('app-view');
            const bottomNav = document.getElementById('bottom-nav');
            const safariFooter = document.getElementById('safari-footer');
            
            if (eventId !== null) activeEventId = eventId;
            if (!container) return;
            
            updateBottomNavActiveState(view);
            const isFullscreenSubView = ['auth', 'transfer-select', 'transfer-method', 'transfer-form', 'barcode', 'manager', 'help-modal', 'notifications-view', 'transfer-success', 'transfer-failed', 'receipt-preview', 'receipt-edit', 'country-modal'].includes(view);
            if (isFullscreenSubView) {
                bottomNav.classList.add('hidden');
                safariFooter.classList.add('hidden');
                container.classList.remove('pb-28');
            } else {
                if (appSettings.useLookTwo) {
                    bottomNav.classList.add('hidden');
                    safariFooter.classList.remove('hidden');
                    container.classList.add('pb-28');
                } else {
                    bottomNav.classList.remove('hidden');
                    safariFooter.classList.add('hidden');
                    container.classList.add('pb-28');
                }
            }
            currentView = view;
            if (eventId !== null && view === 'transfer-select') initSeatStateEmpty();
            render();
            container.scrollTop = 0;
            if (view === 'transfer-success') showOtpToast();
            else hideOtpToast();
        }
        function formatGotTicketsDate(ev) {
            const day = (ev.dayOfWeek || '').toUpperCase();
            const dateStr = (ev.date || '').replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
            if (day && dateStr.toUpperCase().indexOf(day) === -1) {
                return `${day} • ${dateStr}`.toUpperCase();
            }
            return dateStr.toUpperCase();
        }
        function shareGotTickets() {
            const ev = events.find(e => e.id === activeEventId) || events[0];
            if (!ev) return;
            const text = `YOU GOT TICKETS!\n${ev.showTitle}\n${ev.date}\n${ev.venue}`;
            if (navigator.share) {
                navigator.share({ title: ev.showTitle, text }).catch(() => {});
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => alert('Share text copied. Paste it on social media!'));
            } else {
                alert(text);
            }
        }
        function renderGotTicketsShare(ev) {
            const dateLine = formatGotTicketsDate(ev);
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${ev.mapQuery || 'National+Stadium'}`;
            return `
                <a href="${mapsUrl}" target="_blank" class="flex items-center justify-center py-4 relative px-4 border-t border-gray-100 mt-2">
                    <span class="text-[15px] font-bold text-neutral-900">Get Directions</span>
                    <span class="absolute right-5 w-5 h-5 rounded-full border-[3px] border-gray-300 bg-white"></span>
                </a>
                <button type="button" onclick="shareGotTickets()" class="w-full px-1 text-left">
                    <div class="overflow-hidden bg-black flex h-44 shadow-md rounded-xl">
                        <div class="w-[52%] relative overflow-hidden">
                            <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('${ev.imageLink}');"></div>
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/35 to-transparent"></div>
                            <div class="absolute bottom-0 left-0 right-0 p-2.5 text-white">
                                <div class="text-[8px] font-semibold tracking-wide mb-1.5 uppercase leading-tight">${dateLine}</div>
                                <div class="text-[10px] font-black uppercase leading-tight">${ev.showTitle}</div>
                                <div class="text-[8px] text-white/80 mt-1">${ev.venue}</div>
                            </div>
                        </div>
                        <div class="w-[48%] relative overflow-hidden flex flex-col items-center justify-center">
                            <div class="absolute inset-0 bg-cover bg-center scale-125 blur-md" style="background-image: url('${ev.imageLink}');"></div>
                            <div class="absolute inset-0 bg-black/50"></div>
                            <div class="relative z-10 text-center px-3">
                                <div class="text-[14px] font-black italic tracking-wide text-white uppercase leading-tight">YOU GOT<br>TICKETS!</div>
                                <div class="w-10 h-[2px] bg-white mx-auto mt-2.5"></div>
                            </div>
                        </div>
                    </div>
                </button>
                <div class="px-2 pt-4 pb-2">
                    <h3 class="text-[15px] font-bold text-neutral-900 mb-1">Post on Social Media</h3>
                    <p class="text-[12px] text-gray-500 leading-relaxed">Build hype for the event, and share that you got tickets with your friends and family.</p>
                </div>
            `;
        }
        function renderTransferSellDock() {
            return `
                <div class="absolute bottom-12 left-0 right-0 bg-white border-t border-gray-200 flex items-stretch z-40">
                    ${appSettings.allowTransfer ? `
                        <button onclick="switchView('auth')" class="flex-1 flex flex-col items-center justify-center py-2.5 hover:bg-gray-50 transition focus:outline-none">
                            <i class="fa-solid fa-arrow-up-right-from-square text-blue-600 text-[16px]"></i>
                            <span class="text-[11px] font-semibold text-neutral-900 mt-0.5">Transfer</span>
                        </button>
                    ` : `
                        <div class="flex-1 flex flex-col items-center justify-center py-2.5 opacity-40 select-none">
                            <i class="fa-solid fa-ban text-gray-400 text-[16px]"></i>
                            <span class="text-[11px] font-semibold text-gray-400 mt-0.5">Transfer</span>
                        </div>
                    `}
                    <div class="w-px bg-gray-200 my-2.5"></div>
                    <button onclick="alert('Ticket listing enabled for selling.')" class="flex-1 flex flex-col items-center justify-center py-2.5 hover:bg-gray-50 transition focus:outline-none">
                        <i class="fa-solid fa-tag text-neutral-800 text-[16px] -rotate-45"></i>
                        <span class="text-[11px] font-semibold text-neutral-900 mt-0.5">Sell</span>
                    </button>
                </div>
            `;
        }
        function showAppModal(html) {
            const modal = document.getElementById('app-modal');
            if (!modal) return;
            modal.innerHTML = html;
            modal.classList.remove('hidden');
        }
        function hideAppModal() {
            const modal = document.getElementById('app-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.innerHTML = '';
        }
        function renderTransferSuccessCard() {
            return `
                <div class="bg-white rounded-2xl w-full px-6 pt-8 pb-6 text-center shadow-2xl">
                    <div class="w-[72px] h-[72px] rounded-full border-[3px] border-blue-500 flex items-center justify-center mx-auto mb-5">
                        <i class="fa-solid fa-check text-blue-500 text-[32px]"></i>
                    </div>
                    <h2 class="text-[22px] font-extrabold text-neutral-900 mb-2">Successful!</h2>
                    <p class="text-[14px] text-gray-500 mb-6">Ticket Transfer was successful.</p>
                    <button onclick="closeSuccessModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg text-[16px]">OK</button>
                </div>
            `;
        }
        function initSeatStateEmpty() {
            const ev = events.find(e => e.id === activeEventId);
            if (!ev) return;
            selectedSeatsState = {};
            for (let i = 0; i < ev.numTickets; i++) {
                selectedSeatsState[ev.startSeat + i] = false;
            }
        }
        function toggleSeatSelection(seatNum) {
            selectedSeatsState[seatNum] = !selectedSeatsState[seatNum];
            render();
        }
        function validateAndProceedTransfer() {
            if (!appSettings.allowTransfer) {
                alert("Ticket transfers are currently disabled by app settings.");
                return;
            }
            const selectedCount = Object.values(selectedSeatsState).filter(Boolean).length;
            const ev = events.find(e => e.id === activeEventId) || events[0];
            const minReq = ev.minTransferLimit || 1;
            if (selectedCount < minReq) {
                lastFailedRecipient = { count: selectedCount, minRequired: minReq };
                switchView('transfer-failed');
                return;
            }
            if (selectedCount === 0) {
                alert("Please select at least one ticket to transfer.");
                return;
            }
            switchView('transfer-method');
        }
        function executeTransferSubmission() {
            if (!appSettings.allowTransfer) {
                alert("Ticket transfers are currently disabled.");
                return;
            }
            const fName = document.getElementById('recipient-fname')?.value || recipientDraft.fname || 'Alex';
            const lName = document.getElementById('recipient-lname')?.value || recipientDraft.lname || 'Smith';
            const email = document.getElementById('recipient-email')?.value || 'recipient@gmail.com';
            const selectedCount = Object.values(selectedSeatsState).filter(Boolean).length;
            const ev = events.find(e => e.id === activeEventId) || events[0];
            const minReq = ev.minTransferLimit || 1;
            if (selectedCount < minReq) {
                lastFailedRecipient = { name: `${fName} ${lName}`, email: email, count: selectedCount, minRequired: minReq };
                addNotification(
                    "Ticket Transfer Failed",
                    `Transfer to ${fName} ${lName} (${email}) for ${ev.showTitle} could not be completed. Selected ${selectedCount} ticket(s), but event minimum requirement is ${minReq}.`,
                    "Just now"
                );
                switchView('transfer-failed');
                return;
            }
            addNotification(
                "Transfer Pending Acceptance",
                `You transferred tickets for ${ev.showTitle} to ${fName} ${lName} (${email}). Waiting for receiver to accept it.`,
                "Just now"
            );
            switchView('transfer-success');
        }
        function closeSuccessModal() {
            hideOtpToast();
            hideAppModal();
            switchView('details', activeEventId);
        }
        function showOtpToast() {
            const toast = document.getElementById('otp-toast');
            if (!toast) return;
            toast.classList.remove('hidden');
            if (otpToastTimer) clearTimeout(otpToastTimer);
            otpToastTimer = setTimeout(() => {
                hideOtpToast();
            }, 2000);
        }
        function hideOtpToast() {
            const toast = document.getElementById('otp-toast');
            if (toast) toast.classList.add('hidden');
            if (otpToastTimer) {
                clearTimeout(otpToastTimer);
                otpToastTimer = null;
            }
        }
        function openTicketView(index = 0) {
            activeTicketIndex = index;
            switchView('barcode');
        }
        function shiftTicket(delta) {
            const ev = events.find(e => e.id === activeEventId);
            if (!ev || !ev.numTickets) return;
            activeTicketIndex = (activeTicketIndex + delta + ev.numTickets) % ev.numTickets;
            currentView = 'barcode';
            render();
        }
        function barcodeBarsHtml(seed) {
            const widths = [2,7,3,9,2,5,4,8,3,6,2,10,3,5,7,2,8,4,3,6,2,9,4,5,3,8,2,6,4,7,3,5];
            return widths.map((w, i) => `<span class="${(seed + i) % 9 === 0 ? 'blue' : ''}" style="width:${w}px"></span>`).join('');
        }
        function downloadReceiptPDF() {
            window.print();
        }
        function saveEventForm(event) {
            event.preventDefault();
            const locationVal = document.getElementById('form-location')?.value || 'Los Angeles, CA';
            const countryVal = document.getElementById('form-country')?.value || 'United States';
            const flagVal = document.getElementById('form-flagLink')?.value || '🇺🇸';
            const domainVal = document.getElementById('form-domain')?.value || 'ticketmaster.com';
            const minLimitVal = parseInt(document.getElementById('form-minLimit')?.value) || 1;
            const isTrendingVal = document.getElementById('form-isTrending')?.checked || false;
            if (isTrendingVal) {
                events.forEach(e => e.isTrending = false);
            }
            const formData = {
                id: editingEventId ? editingEventId : Date.now(),
                showTitle: document.getElementById('form-showTitle').value,
                ticketType: document.getElementById('form-ticketType').value,
                look2Badge: document.getElementById('form-look2badge')?.value || 'Restricted View',
                imageLink: document.getElementById('form-imageLink').value,
                date: document.getElementById('form-date').value,
                purchaseDate: document.getElementById('form-purchaseDate')?.value || '15 Sep 2026',
                time: document.getElementById('form-time').value,
                dayOfWeek: document.getElementById('form-dayOfWeek')?.value || 'Saturday',
                country: countryVal,
                domain: domainVal,
                flagLink: flagVal,
                location: locationVal,
                venue: document.getElementById('form-venue').value,
                sec: document.getElementById('form-sec').value,
                row: document.getElementById('form-row').value,
                startSeat: parseInt(document.getElementById('form-startSeat').value) || 36,
                numTickets: parseInt(document.getElementById('form-numTickets').value) || 1,
                minTransferLimit: minLimitVal,
                username: document.getElementById('form-username').value,
                orderNumber: document.getElementById('form-orderNumber').value,
                phoneLast4: document.getElementById('form-phoneLast4')?.value || '3321',
                mapQuery: encodeURIComponent(`${locationVal}+${document.getElementById('form-venue').value}`),
                ticketPrice: 246.00,
                bookingFee: 10.00,
                gate: document.getElementById('form-gate')?.value || 'Gate 3 / Door A',
                attendee: document.getElementById('form-attendee')?.value || document.getElementById('form-username').value,
                importantInfo: "Each Mobile Ticket can only be used once. Please keep your tickets safe. Doors open 90 minutes before showtime.",
                isTrending: isTrendingVal
            };
            if (editingEventId) {
                const index = events.findIndex(e => e.id === editingEventId);
                if (index !== -1) events[index] = formData;
            } else {
                events.unshift(formData);
            }
            saveEventsToStorage();
            editingEventId = null;
            switchView('help-modal');
        }
        function deleteEvent(id) {
            if(confirm("Are you sure you want to permanently delete this event?")) {
                events = events.filter(e => e.id !== id);
                saveEventsToStorage();
                switchView('help-modal');
            }
        }
        function openManager(id = null) {
            editingEventId = id;
            switchView('manager');
        }
        function saveReceiptEdits(event) {
            event.preventDefault();
            const ev = events.find(e => e.id === activeEventId) || events[0];
            if (ev) {
                ev.orderNumber = document.getElementById('rec-ord').value;
                ev.username = document.getElementById('rec-name').value;
                ev.email = document.getElementById('rec-email').value;
                ev.showTitle = document.getElementById('rec-title').value;
                ev.date = document.getElementById('rec-date').value;
                ev.purchaseDate = document.getElementById('rec-pdate').value;
                ev.venue = document.getElementById('rec-venue').value;
                ev.location = document.getElementById('rec-loc').value;
                ev.sec = document.getElementById('rec-sec').value;
                ev.row = document.getElementById('rec-row').value;
                ev.startSeat = parseInt(document.getElementById('rec-seat').value) || 36;
                ev.ticketType = document.getElementById('rec-type').value;
                ev.ticketPrice = parseFloat(document.getElementById('rec-price').value) || 246.00;
                ev.bookingFee = parseFloat(document.getElementById('rec-fee').value) || 10.00;
                ev.gate = document.getElementById('rec-gate').value;
                ev.attendee = document.getElementById('rec-attendee').value;
                ev.importantInfo = document.getElementById('rec-info').value;
                saveEventsToStorage();
                alert('Receipt details updated successfully!');
            }
            switchView('receipt-preview');
        }
        function setCountryAndDomain(countryName, flagCode, domainName, cityName) {
            events.forEach(e => {
                e.country = countryName;
                e.flagLink = flagCode;
                e.domain = domainName;
                e.location = cityName;
            });
            saveEventsToStorage();
            switchView('account');
        }

                                </div>
                                <div class="text-left text-[9px] text-gray-400 font-semibold">${activeEv.row} • SEAT ${currentSeatNum}</div>
                            </div>
                        </div>
                        <div>
                            <div class="text-center text-[11px] text-gray-400 font-medium mb-2">${activeTicketIndex + 1} of ${activeEv.numTickets}</div>
                            <div class="flex space-x-2">
                                <button class="flex-1 bg-black hover:bg-neutral-800 text-white py-2.5 rounded-xl text-[11px] font-bold border border-neutral-800 flex items-center justify-center space-x-1 shadow">
                                    <span></span><span>Add to Apple Wallet</span>
                                </button>
                                <button class="bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-2.5 rounded-xl text-[11px] font-bold flex items-center space-x-1 shadow">
                                    <i class="fa-solid fa-circle-info text-xs"></i><span>Info</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentView === 'manager') {
                const ev = editingEventId ? (events.find(e => e.id === editingEventId) || activeEv) : {};
                container.innerHTML = `
                    <div class="bg-neutral-900 text-white min-h-full p-3.5 pb-24 text-[11px] overflow-y-auto">
                        <div class="flex justify-between items-center mb-3 border-b border-neutral-800 pb-2">
                            <h2 class="text-xs font-black tracking-wide">${editingEventId ? 'Edit Event Details' : 'Add New Event'}</h2>
                            <button onclick="switchView('help-modal')" class="text-xs text-gray-400 font-bold hover:text-white">✕ Cancel</button>
                        </div>
                        <form onsubmit="saveEventForm(event)" class="space-y-2.5">
                            <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Account Name:</label><input type="text" id="form-username" value="${ev.username || 'Chester leong'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Show Title:</label><input type="text" id="form-showTitle" value="${ev.showTitle || ''}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Ticket Type:</label><input type="text" id="form-ticketType" value="${ev.ticketType || 'CAT 2 Standard'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Look 2 Badge (e.g. Restricted View):</label><input type="text" id="form-look2badge" value="${ev.look2Badge || 'Restricted View'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Image URL:</label><input type="text" id="form-imageLink" value="${ev.imageLink || 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Attendee Name:</label><input type="text" id="form-attendee" value="${ev.attendee || 'Chester leong'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Gate / Door:</label><input type="text" id="form-gate" value="${ev.gate || 'Gate 3 / Door A'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Location / City:</label><input type="text" id="form-location" value="${ev.location || 'Singapore'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Venue / Stadium:</label><input type="text" id="form-venue" value="${ev.venue || 'Singapore Indoor Stadium'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Country Name:</label><input type="text" id="form-country" value="${ev.country || 'Singapore'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Flag Emoji:</label><input type="text" id="form-flagLink" value="${ev.flagLink || '🇸🇬'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            </div>

                            <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Ticketmaster Domain (e.g. ticketmaster.sg):</label><input type="text" id="form-domain" value="${ev.domain || 'ticketmaster.sg'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>

                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Date:</label><input type="text" id="form-date" value="${ev.date || 'Aug 16'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Time:</label><input type="text" id="form-time" value="${ev.time || '06:00 PM'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            </div>

                            <div class="grid grid-cols-3 gap-1.5">
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Sec:</label><input type="text" id="form-sec" value="${ev.sec || '111'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Row:</label><input type="text" id="form-row" value="${ev.row || 'A'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Start Seat:</label><input type="number" id="form-startSeat" value="${ev.startSeat || 6}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Total Tickets:</label><input type="number" id="form-numTickets" value="${ev.numTickets || 4}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                                <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Min Transfer Limit:</label><input type="number" id="form-minLimit" value="${ev.minTransferLimit || 1}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            </div>

                            <div><label class="block text-gray-400 font-bold mb-0.5 text-[10px]">Order Number:</label><input type="text" id="form-orderNumber" value="${ev.orderNumber || 'QZ232-533R'}" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-white text-[11px]"></div>
                            
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl mt-3 uppercase tracking-wider shadow text-[11px]">Save Event & Persist</button>
                        </form>
                    </div>
                `;
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            render();
        });
        render();
    </script>
</body>
</html>
